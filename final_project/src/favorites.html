<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Out For Music - Search (Home)</title>
  </head>

  <header class="header">
    <div class="logo-container">
      <img src="/src/assets/images/logo.png" alt="Out For Music Logo" class="logo">
      <h1>Out for Music</h1>
    </div>

    <nav class="nav">
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="#">Genres</a></li>
        <li><a href="#">Favorites</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>

    <body>

        <main>
        <h1 id="fav">My Favorites</h1>
        <section id="favorites-container"></section>
        </main>

        <script type="module" src="./favorites/favoritesPage.js"></script>

        <div id="album-modal" class="modal hidden">
        <div class="modal-content">

            <button class="close-modal">&times;</button>

            <img id="modal-cover" alt="Album Cover">

            <h2 id="modal-song"></h2>

            <p>
                <strong>Artist:</strong>
                <span id="modal-artist"></span>
            </p>

            <p>
                <strong>Album:</strong>
                <span id="modal-album"></span>
            </p>

            <div class="modal-buttons">
                <button id="favorite-btn">
                    ❤️ Add to Favorites
                </button>

                <button id="remove-btn" hidden>
                    🗑 Remove from Favorites
                </button>

                <button id="buy-btn">
                    🛒 Buy CD / Vinyl
                </button>
            </div>

        </div>
    </div>

    </body>

  <footer>
    <h3>Powered by Spotify APIs | © 2026 Erick Hurtado</h3>
  </footer> 
</html>
