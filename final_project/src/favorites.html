<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/scripts/buy.js"></script>
    <script type="module" src="./favorites/favoritesPage.js"></script>
    <title>Out For Music - Favorites</title>
  </head>

  <header>
      <div class="logo">
          <img src="./assets/images/logo.png" alt="Site Logo">
          <h1>Out For Music</h1>
      </div>

      <button id="menuButton" aria-label="Open Navigation">
          ☰
      </button>

      <nav id="navigation">
          <ul>
              <li><a href="../index.html">Home</a></li>
              <li><a href="../index.html#footer">Discover</a></li>
              <li><a href="#" class="active">Favorites</a></li>
          </ul>
      </nav>
  </header>

    <body>

        <main>
        <h1 id="fav">My Favorites</h1>
        <section id="favorites-container"></section>
        </main>

        

        <div id="album-modal" class="modal hidden">
        <div class="modal-content">

            <button class="close-modal">&times;</button>

            <img id="modal-cover" alt="Album Cover">

            <h2 id="modal-song"></h2>

            <p>
                <strong>Artist:</strong>
                <span id="modal-artist"></span>
            </p>

            <p>
                <strong>Album:</strong>
                <span id="modal-album"></span>
            </p>

            <div class="modal-buttons">
                <button id="favorite-btn">
                    ❤️ Add to Favorites
                </button>

                <button id="remove-btn" hidden>
                    🗑 Remove from Favorites
                </button>

                <button id="buy-btn">
                    🛒 Buy CD / Vinyl
                </button>
            </div>

        </div>
    </div>

    </body>

  <footer>
      <div class="footer-info">
